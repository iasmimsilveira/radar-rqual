name: Atualizar Radar RQUAL

on:
  schedule:
    - cron: "0 9 25 * *"   # todo dia 25, depois da atualização mensal da Anatel
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python pipeline/baixar.py
      - run: python pipeline/run_all.py
      # Guarda os dados novos no repositório, para o próximo envio publicar a versão atualizada.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Atualização mensal dos dados"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
